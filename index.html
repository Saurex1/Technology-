<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SaurexLink — Задачи</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f0f0f;
      --text-color: #ffffff;
      --card-color: #1e1e1e;
      --input-color: #292929;
    }

    body.light {
      --bg-color: #f2f2f2;
      --text-color: #111;
      --card-color: #fff;
      --input-color: #e0e0e0;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: 0.3s;
      padding-bottom: 60px;
    }

    header {
      padding: 20px;
      text-align: center;
      background-color: var(--card-color);
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      position: sticky;
      top: 0;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .theme-toggle {
      position: absolute;
      top: 15px;
      right: 20px;
      cursor: pointer;
      font-size: 1.4rem;
      background: none;
      border: none;
      color: var(--text-color);
    }

    .todo-container {
      max-width: 600px;
      margin: 40px auto;
      background-color: var(--card-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: var(--input-color);
      color: var(--text-color);
      font-size: 1rem;
    }

    button.add {
      background-color: #444;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      color: #fff;
      font-weight: 600;
      transition: 0.2s;
    }

    button.add:hover { background-color: #666; }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--input-color);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    li.done span {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #f66;
      font-size: 1.2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">🌓Тема</button>

  <header>
    <h1>Мои задачи</h1>
  </header>

  <div class="todo-container">
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Новая задача...">
      <button class="add" onclick="addTask()">Добавить</button>
    </div>
    <ul id="taskList"></ul>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('light');
    }

    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();
      if (text === "") return;

      const li = document.createElement("li");
      li.innerHTML = `
        <span>${text}</span>
        <div>
          <input type="checkbox" onclick="toggleDone(this)">
          <button class="delete-btn" onclick="deleteTask(this)">✕</button>
        </div>
      `;
      document.getElementById("taskList").appendChild(li);
      input.value = "";
    }

    function toggleDone(checkbox) {
      const li = checkbox.closest("li");
      li.classList.toggle("done", checkbox.checked);
    }

    function deleteTask(btn) {
      btn.closest("li").remove();
    }
  </script>
</body>
</html>
